{%extends "layout/templates.html"%}

{%block content%}
<div class="card card-warning">
    <div class="card-header">
        <h3 class="card-title">
            <i class="fas fa-edit"></i> {{title}}
        </h3>
    </div>
    <form action="/admin/users/{{user.id_user}}/edit" method="post">
        <div class="card-body">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control"
                placeholder="masukkan username..." value="{{user.username}}"
                autofocus autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control"
                placeholder="opsional (kosongkan jika tidak ingin di ganti)">
            </div>
            <div class="icheck-primary mb-3">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Lihat password</label>
            </div>
            <div class="form-group">
                <label for="id_role">Role</label>
                <select name="id_role" id="id_role" class="form-control">
                    <option value="">Role....</option>
                    {% for role in roles %}
                    <option value="{{role.id_role}}" {% if user.id_role == role.id_role %} selected {%endif%}>{{role.nama_role}}</option>
                    {%endfor%}
                </select>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-warning">
                <i class="fas fa-save"></i> Update
            </button>
            <a href="/admin/users" class="btn btn-secondary">
                <i class="fas fa-reply"></i> Kembali
            </a>
        </div>
    </form>
</div>
{%endblock%}

{%block js%}
<script>
    document.getElementById('showPassword').addEventListener('change', function() {
        const password = document.getElementById('password')
        password.type = this.checked ? 'text' : 'password'
    })
</script>
{%endblock%}
