{%extends "layout/templates.html"%}

{%block content%}
<div class="card card-dark">
    <div class="card-header">
        <h3 class="card-title">
            <i class="fas fa-plus"></i> {{title}}
        </h3>
    </div>
    <form action="" method="post">
        <div class="card-body">
            <div class="form-group">
                <label for="nama_role">Nama</label>
                <input type="text" name="nama_role" id="nama_role" class="form-control"
                placeholder="masukkan nama role......."
                autofocus autocomplete="off" required>
            </div>
            <div class="form-group">
                <label for="deskripsi">Deskripsi</label>
                <textarea name="deskripsi" id="deskripsi" class="form-control"
                rows="6" placeholder="masukkan deskripsi......."></textarea>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Insert
            </button>
            <a href="/admin/roles" class="btn btn-secondary">
                <i class="fas fa-reply"></i> Kembali
            </a>
        </div>
    </form>
</div>
{%endblock%}
