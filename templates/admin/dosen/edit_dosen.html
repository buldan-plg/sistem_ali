{%extends 'layout/templates.html'%}
<!--  -->
{%block content%}
<div class="card card-warning card-outline">
  <div class="card-header">
    <h3 class="card-title"><i class="fas fa-edit"></i> {{title}}</h3>
  </div>
  <form action="/admin/dosen/update" method="post">
    <input type="hidden" name="id_dosen" value="{{dosen.id_dosen}}" />
    <div class="card-body">
      <div class="form-group">
        <label for="nidn">NIDN</label>
        <input
          type="text"
          name="nidn"
          class="form-control"
          placeholder="Masukkan nidn baru...."
          value="{{dosen.nidn}}"
        />
      </div>
      <div class="form-group">
        <label for="nama">Nama</label>
        <input
          type="text"
          name="nama"
          class="form-control"
          placeholder="Masukkan nama......."
          value="{{dosen.nama_dosen}}"
        />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="Masukkan email aktif....."
          value="{{dosen.email}}"
        />
      </div>
      <div class="from-group">
        <label for="nomor">No Hp</label>
        <input
          type="text"
          name="nomor"
          class="form-control"
          placeholder="Masukkan nomor aktif...."
          value="{{dosen.no_hp}}"
        />
      </div>
      <div class="form-group">
        <label for="alamat">Alamat</label>
        <textarea
          name="alamat"
          class="form-control"
          placeholder="Masukkan alamat......"
          rows="3"
        >
{{dosen.alamat}}</textarea
        >
      </div>
    </div>
    <div class="card-footer">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save"></i> Simpan
      </button>
      <a href="{{url_for('dosen.all_dosen')}}" class="btn btn-secondary">
        <i class="fas fa-reply"></i> Kembali
      </a>
    </div>
  </form>
</div>
{%endblock%}
