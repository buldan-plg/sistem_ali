
<aside class="main-sidebar sidebar-dark-pink elevation-4">
    <!-- Brand Logo -->
    <a href="" class="brand-link">
        <img src="{{ url_for('static', filename='dist/img/logostmik.jpg') }}" alt="Logo" class="brand-image img-circle elevation-3" style="opacity: .8">
        <span class="brand-text font-weight-light">STMIK CM</span>
    </a>

    <!-- Sidebar -->
    <div class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Sidebar user panel (optional) -->
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
    
            <!-- Foto -->
            <div class="image">
                <img src="{{ url_for('static', filename='dist/img/Blank.jpg') }}"
                    class="img-circle elevation-2"
                    alt="User Image">
            </div>

            <!-- Info User -->
            <div class="info">
                <a href="#" class="d-block font-weight-bold">
                    {{session["user"].get("nama")}}
                </a>

                <!-- Role -->
                <small class="text-muted d-block">
                    <span class="badge bg-secondary">{{session['user'].get('role')}}
                </small>

                <!-- Status Online -->
                <span class="text-success">
                    <i class="fas fa-circle" style="font-size:10px;"></i>
                    Online
                </span>
            </div>

        </div>


        <!-- Sidebar Menu -->
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">

                <li class="nav-item">
                    <a href="/admin/dashboard"
                    class="nav-link {% if request.path == '/admin/dashboard' %} active {% endif %}">
                        <i class="nav-icon fas fa-home"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <li class="nav-item {% if request.path.startswith('/admin/mahasiswa')
                    or request.path.startswith('/admin/soal')
                    or request.path.startswith('/admin/jurusan')
                    or request.path.startswith('/admin/minat')
                    or request.path.startswith('/admin/dosen')
                    %} menu-open {% endif %}">

                    <a href="#" class="nav-link {% if request.path.startswith('/admin/mahasiswa')
                    or request.path.startswith('/admin/soal')
                    or request.path.startswith('/admin/jurusan')
                    or request.path.startswith('/admin/minat')
                    or request.path.startswith('/admin/dosen')
                    %} active {% endif %}">

                        <i class="nav-icon fas fa-database"></i>
                        <p>
                            Master Data
                            <i class="fas fa-angle-left right"></i>
                        </p>
                    </a>

                    <ul class="nav nav-treeview">

                        <li class="nav-item">
                            <a href="/admin/mahasiswa"
                            class="nav-link {% if request.path.startswith('/admin/mahasiswa') %} active {% endif %}">
                                <i class="far fa-circle nav-icon text-info"></i>
                                <p>Data Mahasiswa</p>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="/admin/soal"
                            class="nav-link {% if request.path.startswith('/admin/soal') %} active {% endif %}">
                                <i class="far fa-circle nav-icon text-info"></i>
                                <p>Soal</p>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="/admin/dosen"
                            class="nav-link {% if request.path.startswith('/admin/dosen') %} active {%endif%}">
                                <i class="far fa-circle nav-icon text-info"></i>
                                <p>Data Dosen</p>
                            </a>
                        </li>

                    </ul>
                </li>

                <li class="nav-header">Pengaturan</li>
                
                <li class="nav-item">
                    <a href="/admin/users" class="nav-link {% if request.path.startswith('/admin/users') %} active {%endif%}">
                        <i class="nav-icon fas fa-users"></i>
                        <p>Pengguna</p>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/roles" class="nav-link {% if request.path.startswith('/admin/roles') %} active {%endif%}">
                        <i class="nav-icon fas fa-user-shield"></i>
                        <p>Role</p>
                    </a>
                </li>
            {% if session.role == 1 %}
            {% endif %}
                <li class="nav-item">
                    <a onclick="return confirm('Apakah anda yakin akan keluar ?')" href="/logout" class="nav-link {% if request.path.startswith('/logout')%} active {%endif%} text-danger">
                        <i class="nav-icon fas fa-arrow-circle-right"></i>
                        <p>
                            Logout
                        </p>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
</aside>

<script>
    const not = function ()
    {
        return alert("Apakah anda yakin untuk keluar");
    }
</script>
