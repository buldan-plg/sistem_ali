<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STMIK CM | {{title}}</title>
    <link
      rel="icon"
      href="{{url_for('static', filename='dist/img/logostmik.jpg')}}"
      type="image/jpeg"
    />

    <!-- Google Font -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='plugins/fontawesome-free/css/all.min.css')}}"
    />
    <!-- CodeMirror -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='plugins/codemirror/codemirror.css')}}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='plugins/codemirror/theme/monokai.css')}}"
    />
    <!-- AdminLTE -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='dist/css/adminlte.min.css')}}"
    />

    <!-- Quiz CSS Utama -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/quiz.css')}}"
    />

    {% block css %}{% endblock %}

    <!-- Anti-FOUC Script -->
    <script>
      (function () {
        var saved = localStorage.getItem("quiz-theme");
        var sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (sysDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>

  <body class="hold-transition layout-top-nav dashboard-page">
    <div class="wrapper">
      <!-- ── Navbar AdminLTE ── -->
      <nav
        class="main-header navbar navbar-expand-md"
        style="
          background: var(--qz-surface);
          border-bottom: 1px solid var(--qz-border);
          transition: background 0.2s ease;
        "
      >
        <div class="container-fluid">
          <a href="" class="navbar-brand">
            <img
              src="{{url_for('static', filename='dist/img/logostmik.jpg')}}"
              alt="Logo"
              class="brand-image img-circle elevation-3"
              style="opacity: 0.85"
            />
            <span
              class="brand-text font-weight-light"
              style="
                font-family: &quot;Syne&quot;, sans-serif;
                letter-spacing: -0.5px;
                color: var(--qz-text);
              "
            >
              STMIK CM
              <span style="color: var(--qz-accent)">Padangsidimpuan</span>
            </span>
          </a>

          <button
            class="navbar-toggler order-1"
            type="button"
            data-toggle="collapse"
            data-target="#navbarCollapse"
            aria-controls="navbarCollapse"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse order-3" id="navbarCollapse">
            <ul class="qz-navbar-nav ml-auto">
              <li class="nav-item">
                <a
                  href="/mahasiswa/dashboard"
                  class="qz-nav-link {% if request.path.startswith('/mahasiswa/dashboard') %} active {% endif %}"
                >
                  <i class="fas fa-home mr-1.5"></i> Home
                </a>
              </li>

              <li class="nav-item">
                <a
                  href="/mahasiswa/quiz"
                  class="qz-nav-link {% block nav_quiz %}{% endblock %}"
                >
                  <i class="fas fa-code mr-1.5"></i> Quiz
                </a>
              </li>

              <li class="nav-item">
                <a
                  href="/mahasiswa/challenge"
                  class="qz-nav-link {% block nav_challenge %}{% endblock %}"
                >
                  <i class="fas fa-fire mr-1.5"></i> Challenge
                </a>
              </li>

              <li class="nav-item">
                <a href="/logout" class="qz-nav-link qz-logout">
                  <i class="fas fa-sign-out-alt mr-1.5"></i> Logout
                </a>
              </li>

              <li class="nav-item ml-2">
                <button
                  id="theme-toggle"
                  class="qz-btn qz-btn-reset"
                  aria-label="Toggle theme"
                  style="padding: 0.35rem 0.7rem"
                ></button>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <!-- /.navbar -->

      <!-- ── Content Wrapper ── -->
      <div
        class="content-wrapper {% block content_wrapper_class %}{% endblock %}"
      >
        <div class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h1 class="m-0" style="color: var(--qz-text)">{{title}}</h1>
              </div>
              <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                  <li class="breadcrumb-item"><a href="#">Home</a></li>
                  <li class="breadcrumb-item active">{{title}}</li>
                </ol>
              </div>
            </div>
          </div>
        </div>

        <!-- ── Main Content ── -->
        <div class="content">
          <div class="container-fluid px-0">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
      <!-- /.content-wrapper -->

      <!-- ── Footer ── -->
      <footer
        class="main-footer"
        style="
          background: var(--qz-surface);
          border-top: 1px solid var(--qz-border);
          color: var(--qz-muted);
          transition: background 0.2s ease;
        "
      >
        <div
          class="float-right d-none d-sm-inline"
          style="
            font-family: &quot;JetBrains Mono&quot;, monospace;
            font-size: 0.75rem;
          "
        >
          v1.0.0
        </div>
        <strong
          style="
            font-family: &quot;JetBrains Mono&quot;, monospace;
            font-size: 0.75rem;
          "
        >
          &copy; 2024
          <a href="#" style="color: var(--qz-accent)"
            >STMIK CM PADANGSIDIMPUAN</a
          >
        </strong>
        <span style="font-size: 0.75rem"> — All rights reserved.</span>
      </footer>
    </div>
    <!-- ./wrapper -->

    <!-- jQuery & Bootstrap -->
    <script src="{{url_for('static', filename='plugins/jquery/jquery.min.js')}}"></script>
    <script src="{{url_for('static', filename='plugins/bootstrap/js/bootstrap.bundle.min.js')}}"></script>
    <script src="{{url_for('static', filename='plugins/codemirror/codemirror.js')}}"></script>
    <script src="{{url_for('static', filename='plugins/codemirror/mode/css/css.js')}}"></script>
    <script src="{{url_for('static', filename='plugins/codemirror/mode/xml/xml.js')}}"></script>
    <script src="{{url_for('static', filename='plugins/codemirror/mode/htmlmixed/htmlmixed.js')}}"></script>
    <!-- AdminLTE -->
    <script src="{{url_for('static', filename='dist/js/adminlte.min.js')}}"></script>

    <!-- Theme Manager Script -->
    <script src="{{url_for('static', filename='js/quiz_theme.js')}}"></script>

    {% block js %}{% endblock %}
  </body>
</html>
